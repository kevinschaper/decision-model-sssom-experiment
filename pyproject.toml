[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kevmap"
version = "0.1.0"
description = "Experiment: SSSOM mappings (SNOMED CT -> Mondo) generated by Kev System-One decision models, evaluated across model sizes."
authors = [{ name = "Kevin Schaper", email = "kevin@tislab.org" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "httpx>=0.28",
  "rank-bm25>=0.2.2",
  "rapidfuzz>=3.9",
  "pyyaml>=6",
  "numpy>=2",
]

[project.scripts]
kevmap = "kevmap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/kevmap"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
